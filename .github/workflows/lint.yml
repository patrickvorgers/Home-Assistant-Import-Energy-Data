name: Super-Linter

on:
  # keep linting your main branch on every push
  push:
    branches:
      - main

  # run on PRs against main when contributors push commits
  pull_request:
    types: [opened, reopened, synchronize, edited]
    branches:
      - main

permissions:
  # Lint pull requests with read-only repository access.
  contents: read

jobs:
  super-lint:
    name: Lint code base
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Super-Linter
        uses: github/super-linter@latest
        env:
          DEFAULT_BRANCH: main
          VALIDATE_ALL_CODEBASE: true
          VALIDATE_SQL: false
          VALIDATE_SQL_SQLFLUFF: false
          FILTER_REGEX_EXCLUDE: .*\.sql$|.*\.md$
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
